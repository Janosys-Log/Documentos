
name: Sync README

on:
  workflow_dispatch:
  push:
    paths:
      - 'README.md'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GIT
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@koitech.com'

      - name: Copy Readme to Back-End
        run: |
          git clone "https://${{ secrets.PAT_COPY }}@github.com/Janosys-Log/Back-End.git"
          cp README.md ./Back-End/README.md

      - name: Cria PR em Back-End
        id: pr_backend
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PAT_COPY }}
          committer: "github-actions <actions@github.com>"
          author: "github-actions <actions@github.com>"
          commit-message: "docs: atualiza README automaticamente"
          branch: update/back-End
          delete-branch: true
          title: Atualização do README
          body: "PR automático para atualizar o README. FONTE: Documentos"
          base: Staged
          add-paths: README.md
          path: Back-End

      - name: Aprovar PR Back-End
        if: |
          steps.pr_backend.outputs.pull-request-operation == 'created' ||
          steps.pr_backend.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.PAT_APROVE }}
          PR_NUMBER: ${{ steps.pr_backend.outputs.pull-request-number }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo Janosys-Log/Back-End \
            --approve

      - name: Auto-merge Back-End
        if: steps.pr_backend.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3.0.0
        with:
          token: ${{ secrets.PAT_COPY }}
          repository: Janosys-Log/Back-End
          pull-request-number: ${{ steps.pr_backend.outputs.pull-request-number }}
          merge-method: squash

      - name: Copy Readme to FrontEnd
        run: |
          git clone "https://${{ secrets.PAT_COPY }}@github.com/Janosys-Log/Front-End.git"
          cp README.md ./Front-End/README.md

      - name: Cria PR em FrontEnd
        id: pr_frontend
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PAT_COPY }}
          committer: "github-actions <actions@github.com>"
          author: "github-actions <actions@github.com>"
          commit-message: "docs: atualiza README automaticamente"
          branch: update/readme-frontend
          delete-branch: true
          title: Atualização do README
          body: "PR automático para atualizar o README. FONTE: Documentos"
          base: main
          add-paths: README.md
          path: Front-End

      - name: Aprovar PR FrontEnd
        if: |
          steps.pr_frontend.outputs.pull-request-operation == 'created' ||
          steps.pr_frontend.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.PAT_APROVE }}
          PR_NUMBER: ${{ steps.pr_frontend.outputs.pull-request-number }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo Janosys-Log/Front-End \
            --approve

      - name: Auto-merge FrontEnd
        if: steps.pr_frontend.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3.0.0
        with:
          token: ${{ secrets.PAT_COPY }}
          repository: Janosys-Log/Front-End
          pull-request-number: ${{ steps.pr_frontend.outputs.pull-request-number }}
          merge-method: squash

      - name: Copy Readme to .github
        run: |
          git clone "https://${{ secrets.PAT_COPY }}@github.com/Janosys-Log/.github.git" perfil
          cp README.md perfil/profile/README.md

          cd perfil
          git add profile/README.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: Atualiza README.md"
            git push
          else
            echo "README já está atualizado. Nenhuma alteração necessária."
          fi
